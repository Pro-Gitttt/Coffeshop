name: coffee_stock
description: Application de gestion de stock pour café avec Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # UI
  google_fonts: ^6.1.0
  image_picker: ^1.0.7

  # State Management
  provider: ^6.1.1

  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.1
  intl_phone_field: ^3.2.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5
  http: ^1.2.2   # ✅ Added EmailJS support (HTTP requests)

  # Export
  csv: ^6.0.0
  pdf: ^3.10.7
  open_file: ^3.5.1

  # Charts
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
