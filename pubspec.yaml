name: coffee_stock
description: Application de gestion de stock pour café avec Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  
  # UI
  google_fonts: ^6.1.0
  image_picker: ^1.0.7
  
  # State Management
  provider: ^6.1.1
  
  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.1
  
  # Export
  csv: ^6.0.0
  pdf: ^3.10.7
  open_file: ^3.5.1
  
  # Charts
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

